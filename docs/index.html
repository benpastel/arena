<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Liar's Arena</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <meta charset="utf-8">
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="at-lobby">
    <div class="lobby screen">
      <div class="lobby-head">
        <h1>Liar's Arena</h1>
        <a href="how-to-play.html" target="_blank" rel="noreferrer">how to play</a>
      </div>
      <input class="name-input" maxlength="20" spellcheck="false" autocomplete="off" placeholder="your name" aria-label="Your name">
      <button class="box-button new-table" disabled>new table</button>
      <div class="table-list"></div>
    </div>
    <div class="room screen"></div>
    <div class="container">
      <div class="player-info grid-element">
        <div class="hand north">
          <div class="coins">$0</div>
        </div>
        <div class="hand south">
          <div class="coins">$0</div>
        </div>
      </div>
      <div class="other grid-element">
        <div class="unused">
          <div class="unused-contents"></div>
        </div>
        <div class="discard">
          <div class="discard-contents"></div>
        </div>
        <div class="hidden-tiles">
          <div class="hidden-tiles-contents"></div>
        </div>
      </div>
      <div class="board grid-element"></div>
      <div class="log grid-element"></div>
      <div class="prompt grid-element"></div>
      <div class="quit-panel grid-element">
        <button class="box-button quit">quit</button>
      </div>
      <div class="actions grid-element"></div>
    </div>
    <div class="netbar" hidden></div>
    <div class="toast" hidden></div>
    <script src="main.js" type="module"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Liar's Arena</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <meta charset="utf-8">
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="at-lobby">
    <div class="lobby screen">
      <div class="lobby-head">
        <h1>Liar's Arena</h1>
        <a href="how-to-play.html" target="_blank" rel="noreferrer">how to play</a>
      </div>
      <div class="name-field">
        <input class="name-input" maxlength="20" spellcheck="false" autocomplete="off" aria-label="Your name">
      </div>
      <div class="button-row new-table-row"></div>
      <div class="table-list"></div>
    </div>
    <div class="room screen"></div>
    <div class="container">
      <div class="sidebar">
        <div class="in-play" title="what each tile does"></div>
        <div class="smite-cost">
          <span class="option shell"><span class="symbol"><span>⚡</span></span></span>
          <span class="cost"></span>
        </div>
        <div class="acc">
          <div class="acc-row"><span class="acc-label">graveyard</span><span class="acc-tiles graveyard-contents"></span></div>
          <div class="acc-row"><span class="acc-label">unused</span><span class="acc-tiles unused-contents"></span></div>
          <div class="acc-row"><span class="acc-label">unknown to you</span><span class="acc-tiles hidden-tiles-contents"></span></div>
        </div>
        <div class="quit" title="quit">
          <span class="option shell"><span class="symbol"><span>✕</span></span></span>
        </div>
      </div>
      <div class="strip top">
        <div class="who"><span class="name"></span><span class="turn-note"></span></div>
        <div class="coins"><span class="amount"></span></div>
        <div class="hand-tiles"></div>
      </div>
      <div class="board"></div>
      <div class="strip bottom">
        <div class="who"><span class="name"></span><span class="turn-note"></span></div>
        <div class="coins"><span class="amount"></span></div>
        <div class="hand-tiles"></div>
      </div>
      <div class="side">
        <div class="log"></div>
      </div>
    </div>
    <div class="rules" hidden>
      <div class="rules-panel">
        <span class="option shell rules-close"><span class="symbol"><span>✕</span></span></span>
        <div class="rules-list"></div>
      </div>
    </div>
    <div class="netbar" hidden></div>
    <div class="toast" hidden></div>
    <script src="main.js" type="module"></script>
  </body>
</html>
